name: drink_pop_fun
description: Senorita Mixology Edition - Thai office drink picker
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FF337A"
  adaptive_icon_foreground: "assets/app_icon.png"
