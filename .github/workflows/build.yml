
name: Build Flutter Web and Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check app source
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Flutter platform files
        run: flutter create --project-name drink_pop_fun --platforms=web,android --no-pub .

      - name: Install dependencies
        run: flutter pub get

      - name: Render app icons from artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-thai-tlwg
          python -m pip install --user cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          artwork = 'assets/app_icon.svg'
          icons = {
              'assets/app_icon.png': 1024,
              'web/favicon.png': 48,
              'web/icons/Icon-192.png': 192,
              'web/icons/Icon-512.png': 512,
              'web/icons/Icon-maskable-192.png': 192,
              'web/icons/Icon-maskable-512.png': 512,
          }
          for name, size in icons.items():
              Path(name).parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(url=artwork, write_to=name, output_width=size, output_height=size)
          PY

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Web
        run: flutter build web --release --base-href "/drink-pop-fun/"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
